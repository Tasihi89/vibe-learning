<title>__TITLE__</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/_vendor/katex/katex.min.css">
<style>
/* 学习页：一问一答。学习者问，AI（Codex）答，每个回答配一张图。别的都不要。 */
:root {
  color-scheme: light dark;
  --paper: #F2F4F7;
  --sheet: #FFFFFF;
  --ink: #16202B;
  --ink-2: #465363;
  --ink-3: #7A8491;
  --rule: #DCE1E7;
  --accent: #2E44C6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EBFB;
  --marker: #FFE07A;
  --marker-ink: #352A00;
  --sel: rgba(46, 68, 198, .18);
  --ok: #1C7A51;
  --ok-soft: #DDF1E6;
  --code-bg: #EDF0F4;
  --r-contains: #2E44C6;
  --r-isa: #6B4FBB;
  --r-needs: #0F7B8A;
  --r-causes: #B4590A;
  --r-contrast: #B3261E;
  --r-extends: #1C7A51;
  --r-example: #7A8491;
  --shadow: 0 1px 2px rgba(22, 32, 43, .05), 0 8px 28px rgba(22, 32, 43, .07);
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  /* 窗口比 1440 宽时，问答区按窗口宽度等比放大，最多 1.3 倍：排版和 1440 时一模一样，字和图跟着变大 */
  --z: clamp(1, 100vw / 1440px, 1.3);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0F141A; --sheet: #161C24; --ink: #E3E8EE; --ink-2: #A8B2BE; --ink-3: #737E8A; --rule: #27303B;
    --accent: #8D9CFF; --accent-ink: #0F141A; --accent-soft: #222A4D;
    --marker: #D8B43F; --marker-ink: #171200; --sel: rgba(141, 156, 255, .32);
    --ok: #5BC693; --ok-soft: #163126;
    --code-bg: #1C242E;
    --r-contains: #8D9CFF; --r-isa: #B9A4F5; --r-needs: #5CC3D1; --r-causes: #F0A35E; --r-contrast: #F2867C; --r-extends: #5BC693; --r-example: #9AA4B0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  }
}
/* 页的颜色：学习者给重点备注页标的色。--tc 是很淡的底色，--te 是同色深一点，用在细线和圆点上。黄色留给标记，不在这里。
   颜色都是平的，不用渐变：备注页顶上引用那段放进一个圆角色块；侧栏卡片、地图里那一页的块整块上色；页面背景不动 */
[data-tag="red"] { --tc: #FEEBEC; --te: #E5484D; }
[data-tag="pink"] { --tc: #FCE5F3; --te: #D6409F; }
[data-tag="coral"] { --tc: #FEEBE7; --te: #E54D2E; }
[data-tag="orange"] { --tc: #FFEFD6; --te: #F76B15; }
[data-tag="brown"] { --tc: #F6EEE7; --te: #AD7F58; }
[data-tag="sand"] { --tc: #F4F1E6; --te: #A18F5C; }
[data-tag="lime"] { --tc: #EEF7E3; --te: #6DB33F; }
[data-tag="green"] { --tc: #E9F6E9; --te: #46A758; }
[data-tag="mint"] { --tc: #E6F7ED; --te: #29A383; }
[data-tag="teal"] { --tc: #E0F8F3; --te: #12A594; }
[data-tag="cyan"] { --tc: #DEF7F9; --te: #00A2C7; }
[data-tag="sky"] { --tc: #E6F4FE; --te: #0090FF; }
[data-tag="indigo"] { --tc: #EDF2FE; --te: #3E63DD; }
[data-tag="violet"] { --tc: #F4F0FE; --te: #6E56CF; }
[data-tag="purple"] { --tc: #F7EDFE; --te: #8E4EC6; }
[data-tag="magenta"] { --tc: #FBECFC; --te: #AB4ABA; }
[data-tag="gray"] { --tc: #F0F0F3; --te: #8B8D98; }
[data-tag="slate"] { --tc: #E8EEF3; --te: #5E7184; }
@media (prefers-color-scheme: dark) { [data-tag] { --tc: color-mix(in srgb, var(--te) 18%, var(--sheet)); } }
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font: 15px/1.7 var(--f-body); -webkit-font-smoothing: antialiased; }
::selection { background: var(--sel); }
button, textarea, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.hint { font-size: 12.5px; color: var(--ink-3); margin: 0; line-height: 1.6; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); padding: 6px 13px; border-radius: 8px; font-size: 13.5px; line-height: 1.35; cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }
.md p { margin: 0 0 .6em; }
.md > :last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 0 0 .6em; padding-left: 1.3em; }
.md code { font-family: var(--f-mono); font-size: .86em; background: var(--code-bg); padding: .1em .35em; border-radius: 4px; }
.md :not(pre) > code { overflow-wrap: anywhere; } /* 很长的路径不撑破页面 */
.md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font: 14px/1.6 var(--f-mono); }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md strong { font-weight: 650; }
.md h1, .md h2, .md h3, .md h4 { font-size: 1.05em; margin: .9em 0 .3em; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--rule); padding: 4px 8px; }

/* ---------- 骨架 ---------- */
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); }
.btn.home { display: grid; place-items: center; width: 34px; height: 32px; padding: 0; text-decoration: none; color: var(--ink-2); }
.btn.home:hover { color: var(--ink); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--rule); background: var(--sheet); }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
.crumb { border: 0; background: none; padding: 2px 6px; border-radius: 6px; cursor: pointer; font: 700 18px/1.3 var(--f-display); color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumb:hover { background: var(--code-bg); }
.crumb-up { flex: none; padding: 2px 6px; border-radius: 6px; color: var(--ink-2); font-size: 15px; text-decoration: none; }
.crumb-up:hover { background: var(--code-bg); color: var(--ink); }
.crumb-sep { flex: none; color: var(--ink-3); margin: 0 2px; }
.view { position: relative; min-height: 0; display: flex; flex-direction: column; }
.scroll { position: relative; flex: 1; min-height: 0; overflow: auto; }
/* 三栏：左边留白、问答、备注栏。左右两栏一样宽，问答就在窗口正中；窗口不够宽时左边先让出来，备注栏至少 280 */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 780px) minmax(280px, 1fr); column-gap: 24px; align-items: start; padding: 0 20px; zoom: var(--z); }
/* 这一页没有备注时，不给备注栏留位置，问答就在窗口正中（窗口不宽时也不靠左挤着） */
@media (min-width: 900px) { .view:not(:has(.rail .card)) .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 780px) minmax(0, 1fr); } }
.grid > .main, .grid > .composer-in { grid-column: 2; }
.grid > .rail { grid-column: 3; }
#stream { padding-top: 28px; padding-bottom: 40px; }
.main { container-type: inline-size; min-width: 0; grid-row: 1; }
.rail { position: relative; min-width: 0; grid-row: 1; }
/* 左边的目录：只列页，一页一行（写这一页从哪段选出来），同一页里的追问不列。备注页挂在它出自的那一页下面，往右缩一格。
   贴着窗口左边放，不出滚动条；左边留白不够宽时不放（免得贴着正文），问答最上面放一条「这一页是怎么来的」 */
.grid > .toc { grid-column: 1; grid-row: 1; justify-self: start; width: min(100%, 272px); position: sticky; top: 24px; max-height: calc((100vh - 210px) / var(--z)); overflow-y: auto; scrollbar-width: none; font-size: 13px; line-height: 1.5; }
.grid > .toc::-webkit-scrollbar { display: none; }
.toc-title { margin: 0 0 6px 8px; font-size: 12px; color: var(--ink-3); }
.toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul ul { margin-left: 14px; padding-left: 6px; border-left: 1px solid var(--rule); }
.toc-i { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; text-align: left; font: inherit; color: var(--ink-2); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.toc-i span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.toc-i:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
.toc-i.toc-root { font-weight: 600; color: var(--ink); }
.toc-i.on-path { color: var(--ink); }
.toc-i.now { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.toc-i[data-tag]::after { content: ''; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--te); }
.trail { font-size: 13px; line-height: 1.55; }
.trail-h { margin: 0 0 8px; color: var(--ink-3); font-size: 12px; }
.trail ol { list-style: none; margin: 0; padding: 0; }
.trail li { position: relative; padding: 0 0 12px 18px; }
.trail li::before { content: ''; position: absolute; left: 3px; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.trail li::after { content: ''; position: absolute; left: 6px; top: 17px; bottom: 0; width: 1px; background: var(--rule); }
.trail li:last-child { padding-bottom: 0; }
.trail li:last-child::after { display: none; }
.trail li.now::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.trail li[data-tag]::before { background: var(--te); }
.trail-i { display: block; border: 0; background: none; padding: 0; text-align: left; font: inherit; color: var(--ink-2); cursor: pointer; }
.trail-i span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
button.trail-i:hover { color: var(--accent); }
.trail li:first-child .trail-i { color: var(--ink); font-weight: 600; }
.trail li.now .trail-i { color: var(--ink); font-weight: 600; cursor: default; }
.trail.inline { margin: 0 0 22px; }
.trail.inline li { padding-bottom: 4px; }
.trail.inline li::after { top: 16px; }
.trail.inline .trail-i span { -webkit-line-clamp: 1; }
@media (min-width: 1440px) { .main > .trail.inline { display: none; } }
@media (max-width: 1439px) { .grid > .toc { display: none; } }
@media (max-width: 899px) {
  .grid { grid-template-columns: minmax(0, 780px); justify-content: center; }
  .grid > .main, .grid > .composer-in, .grid > .rail { grid-column: 1; grid-row: auto; }
  .rail { position: static; display: flex; flex-direction: column; gap: 10px; }
  .rail .card { position: static; width: auto; }
}

/* ---------- 问答 ---------- */
.empty { padding: calc(8vh / var(--z)) 0 0; }
.empty h1 { font: 700 28px/1.3 var(--f-display); margin: 0 0 6px; }
.lead { font-size: 16px; color: var(--ink-2); margin: 0 0 22px; }
.starters { display: flex; flex-direction: column; gap: 8px; }
.fq { text-align: left; border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 9px 13px; font-size: 14.5px; cursor: pointer; color: var(--ink); line-height: 1.5; }
.fq:hover { border-color: var(--accent); color: var(--accent); }
.qa { margin: 0 0 36px; scroll-margin-top: 16px; }
.q { font: 600 20px/1.45 var(--f-display); margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.a { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.a > .a-text:first-child { font-size: 16.5px; }
.status { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.a-text.typing > :last-child::after { content: ""; display: inline-block; width: .45em; height: 1.05em; margin-left: 3px; vertical-align: -.15em; border-radius: 2px; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.saved { align-self: flex-start; border: 1px solid var(--ok); background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; text-align: left; }
.composer { border-top: 1px solid var(--rule); background: var(--sheet); }
.composer .grid { padding-top: 10px; padding-bottom: 12px; }
/* 输入框：一个圆角的整体，右下角嵌一个圆按钮。没写字时按钮是灰的；正在回答时换成「停止」 */
.ask-row { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--rule); border-radius: 16px; background: var(--paper); padding: 6px 6px 6px 14px; transition: border-color .15s, box-shadow .15s; }
.ask-row:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--rule)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); background: var(--sheet); }
#ask-input { flex: 1; min-width: 0; resize: none; border: 0; background: none; padding: 6px 0; line-height: 1.55; font-size: 15px; max-height: 160px; }
#ask-input:focus { outline: none; }
.send { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; padding: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; transition: background .15s, transform .1s; }
.send:hover { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); }
.send:active { transform: scale(.94); }
#ask-input:placeholder-shown ~ #btn-send, .send:disabled { background: color-mix(in srgb, var(--ink-3) 28%, var(--paper)); color: var(--sheet); cursor: default; transform: none; }
.send.stop { background: var(--ink); color: var(--sheet); }
#ask-status { margin-top: 6px; }

/* ---------- 选中一段：问 Codex、标记 ---------- */
mark.hl { background: var(--marker); color: var(--marker-ink); border-radius: 2px; cursor: pointer; }
tspan.hl { fill: var(--r-causes); font-weight: 700; cursor: pointer; }
tspan.cm { text-decoration: underline; cursor: pointer; }
tspan.cm.on { fill: var(--accent); }
.selbar { position: fixed; z-index: 50; display: flex; gap: 2px; padding: 4px; background: var(--ink); border-radius: 10px; box-shadow: var(--shadow); }
.selbar button { border: 0; background: transparent; color: var(--paper); font-size: 13.5px; padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.selbar button:hover { background: color-mix(in srgb, var(--paper) 16%, transparent); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; }
.linkish:hover { text-decoration: underline; text-underline-offset: 2px; }

/* ---------- 备注：引用的那段划线，卡片在侧栏 ---------- */
.cm { border-bottom: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent); cursor: pointer; }
.cm.on { border-bottom-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.card { position: absolute; left: 0; width: min(100%, 340px); container-type: inline-size; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.6; transition: top .18s ease, box-shadow .18s; cursor: pointer; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); z-index: 2; }
.card-quote { border-left: 3px solid var(--marker); padding-left: 8px; color: var(--ink-3); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-body { max-height: 240px; overflow: hidden; }
.card-body.clip { -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.card.on .card-body { max-height: none; -webkit-mask-image: none; mask-image: none; }
.cq { font-weight: 650; margin: 8px 0 4px; overflow-wrap: anywhere; }
.ca { display: flex; flex-direction: column; gap: 10px; overflow-wrap: anywhere; }
.ca .vt { font-size: 13px; }
.card-foot { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.card-input { resize: none; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); padding: 6px 9px; font-size: 13.5px; line-height: 1.5; max-height: 120px; }
.card-input:focus { outline: none; border-color: var(--accent); }
.card:not(.on) .card-input { display: none; }
.card-btns { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.card-acts { display: inline-flex; align-items: center; gap: 14px; }
.card-btns > *, .card-acts > * { white-space: nowrap; flex-shrink: 0; }
/* 删除：卡片上平时不露，鼠标移到卡片上、卡片点开时才出来；点一下变成红字「确定删除」 */
.cdel { border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-3); font-size: 12px; }
.cdel:hover, .cdel.arm { color: var(--r-contrast); }
.cdel.arm { font-weight: 600; }
.card .cdel { visibility: hidden; }
.card:hover .cdel, .card.on .cdel, .card .cdel.arm, .card .cdel:focus-visible { visibility: visible; }
.thread-head { margin: 0 0 28px; }
.q-quote { border-left: 3px solid var(--marker); padding: 2px 0 2px 12px; color: var(--ink); font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 6px; }
/* ---------- 复述：白框右上角的图标，复述页，复述合集页，收进思维模型 ---------- */
/* 图标里没有字（字在 data-tip 里，鼠标移上去才显示），不然会混进回答的文字，标记和备注的位置就错了 */
.a { position: relative; }
.ico { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 1px solid var(--rule); border-radius: 50%; background: var(--sheet); color: var(--ink-3); cursor: pointer; transition: opacity .12s, color .12s, border-color .12s; }
.ico svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.ico.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); background: var(--accent-soft); }
[data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; z-index: 6; white-space: nowrap; padding: 3px 8px; border-radius: 6px; background: var(--ink); color: var(--paper); font: 12px/1.5 var(--f-body); pointer-events: none; }
.rt { position: absolute; top: -12px; right: -12px; z-index: 3; opacity: 0; }
.qa:hover .rt, .rt:focus-visible, .rt.on { opacity: 1; }
.keep { position: absolute; top: -2px; right: 0; z-index: 3; opacity: 0; }
.view-fig.keepable { position: relative; }
.view-fig.keepable > .vt { padding-right: 36px; }
.view-fig.keepable:hover .keep, .keep:focus-visible, .keep.on { opacity: 1; }
.keep.on svg { fill: var(--accent); }
.keep.on svg .k-plus { stroke: var(--accent-ink); }
@media (hover: none) { .rt, .keep { opacity: 1; } }
.rt-head { margin: 0 0 28px; }
.rt-title { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font: 700 22px/1.35 var(--f-display); overflow-wrap: anywhere; }
.rt-title svg { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.thread-head.rt-head[data-tag] .rt-title svg { stroke: var(--te); }
.rt-list h1 { font: 700 26px/1.3 var(--f-display); margin: 0 0 18px; }
.rt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.rt-card { display: flex; flex-direction: column; gap: 6px; min-height: 112px; padding: 13px 15px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.rt-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--rule)); box-shadow: var(--shadow); }
.rt-card[data-tag] { background: var(--tc); border-color: color-mix(in srgb, var(--te) 25%, var(--rule)); }
.rt-card b { font-weight: 600; font-size: 15px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.rt-card p { margin: 0; flex: 1; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.rt-card span { color: var(--ink-3); font-size: 12.5px; }
.toc > ul > li.toc-group { margin-top: 14px; }
.btn.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.flash { animation: flash 1.8s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--marker); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* ---------- 地图：一页一块，从左往右长 ---------- */
.mapview { position: absolute; inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column; }
.map-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--rule); background: var(--sheet); }
.map-head b { flex: 1; }
.map-scroll { flex: 1; min-height: 0; overflow: auto; padding: 28px 32px 40px; }
.map-scroll.panning, .map-scroll.panning * { cursor: grabbing; user-select: none; }
.mm { position: relative; }
.mm svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.mm path { fill: none; stroke: color-mix(in srgb, var(--ink-3) 60%, var(--paper)); stroke-width: 1.4; }
/* 一页一块：顶上一行是这一页从哪来（备注页是选中的那段，开头那页是主题名），下面按先后一行一个问题 */
.mblock { position: absolute; display: flex; flex-direction: column; background: var(--sheet); border: 1.5px solid var(--rule); border-radius: 10px; overflow: hidden; }
.mblock.cur { box-shadow: 0 0 0 2px var(--accent); }
.mblock[data-tag] { background: var(--tc); border-color: color-mix(in srgb, var(--te) 30%, var(--rule)); }
.mb-h, .mb-q { flex: none; display: flex; align-items: center; width: 100%; border: 0; background: none; text-align: left; font: inherit; cursor: pointer; color: var(--ink); }
.mb-h span, .mb-q span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.mb-h { position: relative; padding: 4px 30px 4px 14px; font-size: 12px; line-height: 1.4; color: var(--ink-2); border-bottom: 1px solid var(--rule); }
.mb-h::before { content: ''; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--marker); }
.mblock[data-tag] .mb-h::before { background: var(--te); }
.mb-root .mb-h { padding-left: 12px; font: 700 14px/1.3 var(--f-display); color: var(--ink); }
.mb-root .mb-h::before { display: none; }
.mb-q { padding: 4px 12px; font-size: 13px; line-height: 1.4; }
.mb-q + .mb-q { border-top: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.mb-h:hover, .mb-q:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.mn { position: absolute; display: flex; align-items: center; text-align: left; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 9px; padding: 4px 10px; font-size: 13px; line-height: 1.4; cursor: pointer; color: var(--ink); }
.mn span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mn:hover { border-color: var(--accent); }
.mmark { border: 0; border-radius: 3px; background: var(--marker); color: var(--marker-ink); font-size: 12.5px; }
.mm path.pm { stroke-dasharray: 3 3; }
.mcpick { position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); padding: 0; cursor: pointer; opacity: 0; transition: opacity .12s; display: grid; place-items: center; }
.mcpick::before { content: ''; width: 9px; height: 9px; border-radius: 50%; border: 1.5px dashed var(--ink-3); box-sizing: border-box; }
.mcpick[data-tag]::before { border: 1px solid var(--te); background: var(--tc); }
.mblock:hover + .mcpick, .mcpick:hover, .mcpick:focus-visible { opacity: 1; }
.cpick { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-3); font-size: 12px; }
.cpick::before { content: ''; width: 11px; height: 11px; border-radius: 50%; border: 1.5px dashed var(--ink-3); box-sizing: border-box; }
.cpick[data-tag]::before { border: 1px solid var(--te); background: var(--tc); }
.cpick:hover { color: var(--accent); }
.cpop { position: fixed; z-index: 70; display: grid; grid-template-columns: repeat(6, 24px); gap: 8px; padding: 10px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.cpop .sw { width: 24px; height: 24px; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--te) 45%, transparent); padding: 0; background: var(--tc); cursor: pointer; }
.cpop .sw:hover { border-color: var(--te); }
.cpop .sw.on { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--te); }
.cpop .sw-none { grid-column: 1 / -1; justify-self: start; border: 0; background: none; color: var(--ink-3); font-size: 12px; cursor: pointer; padding: 2px 0; }
.cpop .sw-none:hover { color: var(--accent); }
.card[data-tag] { background: var(--tc); border-color: color-mix(in srgb, var(--te) 25%, var(--rule)); }
.card[data-tag] .card-input { background: color-mix(in srgb, var(--sheet) 75%, transparent); }
.thread-head[data-tag] { background: var(--tc); border-radius: 12px; padding: 14px 16px 10px; }
@media (min-width: 900px) { .thread-head[data-tag] { margin-left: -16px; margin-right: -16px; } }
.thread-head[data-tag] .q-quote { border-left-color: var(--te); }
.cm[data-tag] { border-bottom-color: color-mix(in srgb, var(--te) 60%, transparent); }

/* ---------- 图：每种一个画法 ---------- */
.view-fig { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vt { font-weight: 600; font-size: 14.5px; }
.v-bottom { margin: 0; font-size: 14px; color: var(--ink-2); }
small { display: block; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; font-weight: 400; }

/* draw：AI 自己画的图（SVG）。颜色、字体从页面继承，图里写 style="fill:var(--accent)" 这样的颜色变量 */
.dw svg { display: block; width: 100%; height: auto; margin: 0 auto; overflow: visible; fill: var(--ink); font-family: var(--f-body); font-size: 14px; }
.card .dw { cursor: zoom-in; }

/* tree：组成 */
.tv ul { list-style: none; margin: 0; padding: 0 0 0 26px; }
.tv > ul { padding-left: 0; }
.tv li { position: relative; padding: 5px 0 5px 18px; }
.tv > ul > li { padding-left: 0; }
.tv li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--rule); }
.tv li::after { content: ""; position: absolute; left: 0; top: 24px; width: 16px; border-top: 1.5px solid var(--rule); }
.tv li:last-child::before { bottom: auto; height: 24px; }
.tv > ul > li::before, .tv > ul > li::after { display: none; }
.tn { display: inline-flex; flex-direction: column; max-width: 100%; border: 1.5px solid var(--ink-3); border-radius: 8px; padding: 6px 11px; background: var(--sheet); line-height: 1.45; }
.tn b { font-weight: 600; }
.tn.mark { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }

/* web：关系 */
.wv-graph { position: relative; height: 400px; }
.wv-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wv-graph line { stroke: var(--rule); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.wn { position: absolute; transform: translate(-50%, -50%); width: 148px; text-align: center; border: 1.5px solid var(--ink-3); border-radius: 10px; background: var(--sheet); padding: 6px 9px; line-height: 1.4; z-index: 1; }
.wn b { font-weight: 600; font-size: 14px; }
.wn small { font-size: 11.5px; }
.wn.wc { width: 168px; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); z-index: 2; }
.wl { position: absolute; transform: translate(-50%, -50%); font-size: 11.5px; line-height: 1; padding: 3px 7px; border-radius: 99px; background: var(--sheet); border: 1px solid currentColor; white-space: nowrap; z-index: 1; }
.wv-list { display: none; flex-direction: column; gap: 6px; font-size: 14px; }
.wv-list .wl { position: static; transform: none; display: inline-block; margin-right: 4px; }
.wv-c { font-weight: 650; font-size: 15px; }
.r-contains, .r-partOf { color: var(--r-contains); stroke: var(--r-contains) !important; }
.r-isa, .r-kind { color: var(--r-isa); stroke: var(--r-isa) !important; }
.r-needs, .r-usedBy { color: var(--r-needs); stroke: var(--r-needs) !important; }
.r-causes, .r-because { color: var(--r-causes); stroke: var(--r-causes) !important; }
.r-contrast { color: var(--r-contrast); stroke: var(--r-contrast) !important; stroke-dasharray: 4 3; }
.r-extends { color: var(--r-extends); stroke: var(--r-extends) !important; }
.r-example { color: var(--r-example); stroke: var(--r-example) !important; stroke-dasharray: 2 3; }
@container (max-width: 600px) {
  .wv-graph { display: none; }
  .wv-list { display: flex; }
}

/* flow：流程 */
.fl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fl li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.fl li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; border-left: 1.5px solid var(--rule); }
.fn { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 12.5px/28px var(--f-mono); text-align: center; }
.fl b { display: block; font-weight: 650; margin-top: 2px; }
/* 有角色的流程：时序图。左边谁找谁，右边这一步在干什么 */
.sq { display: grid; grid-template-columns: minmax(0, var(--lw, 1fr)) minmax(0, 1fr); column-gap: 20px; }
.sq-lanes { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.sq-head { text-align: center; padding-bottom: 4px; }
.sq-head span { display: inline-block; max-width: calc(100% - 4px); font-size: 12.5px; font-weight: 600; line-height: 1.35; padding: 3px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); overflow-wrap: anywhere; }
.sq-cell { min-height: 48px; }
.sq-life { position: absolute; top: 0; bottom: 0; border-left: 1.5px dashed var(--rule); }
.sq-arr { position: absolute; top: 24px; height: 0; border-top: 2px solid var(--accent); }
.sq-arr::after { content: ""; position: absolute; top: -6px; right: -1px; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 9px solid var(--accent); }
.sq-arr.rev::after { right: auto; left: -1px; border-left: 0; border-right: 9px solid var(--accent); }
.sq-num { position: absolute; top: 24px; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: var(--sheet); border: 1.5px solid var(--accent); color: var(--accent); font: 600 11.5px/19px var(--f-mono); text-align: center; z-index: 1; }
.sq-num.at { background: var(--accent); color: var(--accent-ink); }
.sq-txt { border-top: 1px solid var(--rule); padding: 12px 0; font-size: 14px; line-height: 1.6; }
.sq-txt b { font-weight: 650; }
.sq-txt b i { font: 600 12px var(--f-mono); font-style: normal; color: var(--accent); margin-right: 6px; }
.sq-txt .md { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
/* 窄屏：整张图在上，步骤说明按编号列在下面 */
@container (max-width: 560px) {
  .sq { grid-template-columns: minmax(0, 1fr); }
  .sq-gap { display: none; }
  .sq-cell { min-height: 42px; }
  .sq-arr, .sq-num { top: 21px; }
  .sq-txt { order: 1; padding: 9px 0; }
  .sq-txt:nth-child(4) { margin-top: 10px; }
}

/* compare：对比 */
.cv-grid { display: grid; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.cv-grid > div { padding: 9px 12px; border-top: 1px solid var(--rule); font-size: 14px; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.cv-grid > .cv-h { border-top: 0; background: var(--code-bg); font-weight: 650; }
.cv-a { color: var(--ink-3); font-size: 13px !important; }
.cv-cards { display: none; flex-direction: column; gap: 10px; }
.cv-card { border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; }
.cv-card > b { font-weight: 650; }
.cv-card dl { margin: 6px 0 0; display: grid; gap: 4px; font-size: 14px; }
.cv-card dt { font-size: 12px; color: var(--ink-3); }
.cv-card dd { margin: 0; }
@container (max-width: 560px) {
  .cv-grid { display: none; }
  .cv-cards { display: flex; }
}

/* cause：因果 */
.ca { display: flex; flex-direction: column; align-items: stretch; }
.ca-n { border: 1.5px solid var(--ink-3); border-radius: 8px; padding: 8px 12px; background: var(--sheet); }
.ca-arrow { align-self: center; font-size: 12px; color: var(--r-causes); padding: 3px 0; }
.ca-flip { margin-top: 10px; border: 1.5px dashed var(--ink-3); border-radius: 8px; padding: 8px 12px; color: var(--ink-2); }
.ca-flip span, .an-b span { display: block; font-size: 11.5px; letter-spacing: .06em; color: var(--ink-3); }

/* analogy：类比 */
.an { display: grid; grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr); gap: 6px 0; align-items: stretch; }
.an-h { font-size: 12px; color: var(--ink-3); padding: 0 4px; }
.an-r, .an-l { border-radius: 8px; padding: 7px 11px; font-size: 14px; }
.an-r { background: var(--accent-soft); }
.an-l { background: var(--marker); color: var(--marker-ink); }
.an-x { display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.an-b { border: 1.5px dashed var(--ink-3); border-radius: 8px; padding: 8px 12px; color: var(--ink-2); font-size: 14px; }

/* layers：分层，一层套一层 */
.ly { border: 1.5px solid var(--ink-3); border-radius: 10px; padding: 8px 10px 10px; background: color-mix(in srgb, var(--accent-soft) 35%, var(--sheet)); }
.ly .ly { margin-top: 8px; background: color-mix(in srgb, var(--accent-soft) 70%, var(--sheet)); }
.ly .ly .ly { background: var(--sheet); }
.ly .ly .ly .ly { background: color-mix(in srgb, var(--accent-soft) 35%, var(--sheet)); }
.ly-h b { font-weight: 650; font-size: 14px; }
.ly-label { font-size: 12px; color: var(--ink-3); }

/* instance：实物 */
.in-code pre { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px 0; overflow-x: auto; font: 12.5px/1.7 var(--f-mono); }
.in-l { display: block; padding: 0 12px 0 0; white-space: pre; }
.in-l i { display: inline-block; width: 34px; text-align: right; padding-right: 10px; color: var(--ink-3); font-style: normal; user-select: none; }
.in-l.mk { background: color-mix(in srgb, var(--marker) 55%, transparent); }
.in-l em { font-style: normal; display: inline-flex; width: 17px; height: 17px; margin-left: 8px; align-items: center; justify-content: center; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; vertical-align: 1px; }
.in-notes { margin: 0; padding-left: 1.4em; font-size: 14px; }
.in-rows { margin: 0; display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.in-rows div { display: grid; grid-template-columns: minmax(100px, max-content) minmax(0, 1fr); gap: 14px; padding: 7px 12px; border-top: 1px solid var(--rule); font-size: 14px; }
.in-rows div:first-child { border-top: 0; }
.in-rows dt { color: var(--ink-3); }
.in-rows dd { margin: 0; font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }

/* timeline：历史 */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--rule); }
.tl li:first-child { border-top: 0; }
.tl .when { font: 12px/1.8 var(--f-mono); color: var(--ink-3); }
.tl b { font-weight: 650; }

/* scale：尺度 */
.sc { display: flex; flex-direction: column; gap: 8px; }
.sc-r { display: grid; grid-template-columns: minmax(80px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.sc-bar { height: 12px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.sc-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.sc-v { font: 12.5px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; }

/* formula：公式 */
.fm { overflow-x: auto; font-size: 1.15em; padding: 6px 0; text-align: center; }
.fm-parts { margin: 0; display: grid; gap: 4px; font-size: 14px; }
.fm-parts div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; }
.fm-parts dt { text-align: right; font-family: var(--f-mono); }
.fm-parts dd { margin: 0; color: var(--ink-2); }

/* ---------- 课程：一集一页。预习、学、复习三段，每一块是一个白框；时间能点，点了视频跳过去 ---------- */
.lesson-head { padding: calc(4vh / var(--z)) 0 6px; }
.lh-course { margin: 0 0 4px; font-size: 13px; color: var(--ink-3); }
.lesson-head h1 { font: 700 28px/1.3 var(--f-display); margin: 0 0 6px; }
.lh-meta { margin: 0; font-size: 14px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.part { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); font: 700 22px/1.3 var(--f-display); scroll-margin-top: 12px; }
.part small { display: inline; font: 400 13.5px/1.4 var(--f-body); color: var(--ink-3); }
.qa.lesson .q { font-size: 21px; }
.qa.asked { margin-left: 22px; }
.qa.asked .q { font-size: 17px; }
.qa.asked .a { box-shadow: none; }
.ts { color: var(--accent); cursor: pointer; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ts::before { content: '▶'; display: inline-block; font-size: .62em; margin-right: 3px; vertical-align: .14em; }
.ts:hover { background: var(--accent-soft); }
.md blockquote { margin: 0 0 .6em; padding: 6px 12px; border-left: 3px solid var(--r-causes); background: color-mix(in srgb, var(--r-causes) 7%, transparent); border-radius: 0 6px 6px 0; color: var(--ink-2); }
.md blockquote p:last-child { margin-bottom: 0; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.shot img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border: 1px solid var(--rule); border-radius: 8px; background: var(--code-bg); cursor: zoom-in; }
.shot figcaption { font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
.modal-body img.zoom { display: block; max-width: 100%; margin: 0 auto; border-radius: 6px; }
.modal-box:has(img.zoom) { width: min(1200px, 100%); }
.fold { border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.fold > summary { padding: 8px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2); list-style-position: inside; }
.fold > summary:hover { color: var(--ink); }
.fold[open] > summary { border-bottom: 1px solid var(--rule); color: var(--ink); }
.fold > .md { padding: 10px 14px 12px; font-size: 14px; }
.fold-raw > .md { max-height: 460px; overflow-y: auto; color: var(--ink-2); }
.fold-quiz { background: var(--sheet); }
.fold-quiz > summary { color: var(--ink); font-size: 15px; line-height: 1.6; }
.fold-quiz > .md { font-size: 14.5px; }
/* steps：一步一张图，「上一步」「下一步」翻 */
/* 每一步叠在同一格里：整块的高度是最高那一步的高度，翻页时「下一步」不跟着跳 */
.st { display: grid; row-gap: 12px; }
.st-frame { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 10px; }
.st-frame:not(.on) { visibility: hidden; }
.st-bar { grid-area: 2 / 1; }
.st-cap { font-size: 15.5px; color: var(--ink); }
.st-bar { display: flex; align-items: center; gap: 10px; }
.st-dots { display: flex; gap: 6px; flex: 1; justify-content: center; }
.st-dot { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: var(--rule); cursor: pointer; }
.st-dot.on { background: var(--accent); }
.st-bar .btn:disabled { visibility: hidden; }
/* 一张图分几页亮出来：说明叠在第一格，图在第二格只有一张，图里标着 data-step 的东西翻到那一页才出来，出来时淡入 */
.st.layer .st-pic { grid-area: 2 / 1; }
.st.layer .st-bar { grid-area: 3 / 1; }
.st-pic [data-step] { transition: opacity .35s; }
.st-pic .st-off { opacity: 0; visibility: hidden; transition: none; }
/* 边讲边画：每页的话画在图里（data-say），上面不放说明；翻过去以后那句话变淡，眼睛只落在这一页的新话上 */
.st.says .st-frame { display: none; }
.st.says .st-pic { grid-area: 1 / 1; }
.st.says .st-bar { grid-area: 2 / 1; }
.st-pic [data-say] { transition: opacity .35s; }
.st-pic .st-said { opacity: .5; }
/* 顶栏：预习、学、复习，和视频 */
.parts-nav { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--rule); border-radius: 9px; background: var(--paper); }
.parts-nav button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.parts-nav button:hover { color: var(--ink); }
.parts-nav button.on { background: var(--sheet); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(22, 32, 43, .08); }
/* 视频：浮在右下角，按住顶上那条能拖开 */
.vid { position: fixed; right: 20px; bottom: 120px; z-index: 45; width: 440px; max-width: calc(100vw - 24px); background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow), 0 12px 40px rgba(22, 32, 43, .18); overflow: hidden; }
.vid.big { width: min(820px, calc(100vw - 24px)); }
.vid-head { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; cursor: move; user-select: none; touch-action: none; }
.vid-head b { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.vid video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }

/* ---------- 浮层 ---------- */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(16, 22, 30, .45); display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--sheet); border-radius: var(--r); box-shadow: var(--shadow); width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.modal-body { padding: 16px 20px 24px; overflow: auto; }
.modal-body pre.raw { white-space: pre-wrap; font: 13px/1.6 var(--f-mono); margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 70; max-width: calc(100% - 32px); }

@media (max-width: 720px) {
  .grid { padding-left: 14px; padding-right: 14px; }
  .a { padding: 16px; }
  .q { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
